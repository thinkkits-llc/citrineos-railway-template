[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[build.args]
NEXT_PUBLIC_API_URL = "https://${{graphql-engine.RAILWAY_PUBLIC_DOMAIN}}/v1/graphql"
NEXT_PUBLIC_WS_URL = "wss://${{graphql-engine.RAILWAY_PUBLIC_DOMAIN}}/v1/graphql"
NEXT_PUBLIC_CITRINE_CORE_URL = "https://${{nginx.RAILWAY_PUBLIC_DOMAIN}}"
NEXT_PUBLIC_FILE_SERVER_URL = "http://directus.railway.internal:8055"
NEXT_PUBLIC_LOGO_URL = "https://d1h8867rcwtfcw.cloudfront.net/logo-collapsed.svg"

[deploy]
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[variables]
NEXTAUTH_SECRET = "change-me-to-a-strong-random-secret"
ADMIN_PASSWORD = "CitrineOS!"
