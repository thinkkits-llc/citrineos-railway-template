upstream citrine_http {
    server citrineos-core.railway.internal:8080;
}

upstream citrine_ws_201 {
    server citrineos-core.railway.internal:8081;
}

upstream citrine_ws_16 {
    server citrineos-core.railway.internal:8082;
}

upstream citrine_ws_certificates {
    server citrineos-core.railway.internal:8083;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${PORT:-8080};

    # OCPP 2.0.1 / 2.1 WebSocket
    location /ws/ocpp201/ {
        proxy_pass http://citrine_ws_201/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # OCPP 1.6 WebSocket
    location /ws/ocpp16/ {
        proxy_pass http://citrine_ws_16/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Certificate management WebSocket
    location /ws/certificates/ {
        proxy_pass http://citrine_ws_certificates/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API + Data API (default)
    location / {
        proxy_pass http://citrine_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
